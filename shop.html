<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store • Tres Amigos, Una Vida</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/3dudes1life/tresamigosunavida/main/Tres%20Amigos%2C%20Una%20Vida_book%20cover.png" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(to bottom, #fcd34d, #ff6b6b);
      color: #222;
      text-align: center;
    }

    /* Top nav (mirrors index.html) */
    nav {
      position: sticky;
      top: 0; left: 0; width: 100%;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      padding: 1rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      flex-wrap: wrap;
    }
    nav a {
      color: #222;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
    }
    nav a:hover { color: #ff6b6b; }

    header.hero {
      min-height: 42vh;
      display: grid;
      place-items: center;
      padding: 6rem 1rem 2rem;
    }
    header.hero h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      margin: 0 0 .25rem;
    }
    header.hero p { margin: 0.25rem 0 0; max-width: 800px; }

    main { max-width: 1200px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .store-card {
      background: rgba(255,255,255,0.92);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      padding: 1rem;
    }
    .note {
      font-size: .95rem; opacity: .85; margin: .5rem 0 1rem;
    }

    /* Optional: nudge Shopify product cards a bit when wide */
    @media (min-width: 1024px) {
      .store-card { padding: 1.25rem 1.5rem; }
    }

    footer {
      text-align: center; padding: 2rem 1rem; font-size: 0.9rem;
      background: linear-gradient(to bottom, #ff6b6b, #fcd34d); color: #222;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html#home">Home</a>
    <a href="index.html#trio">Meet the Trio</a>
    <a href="index.html#behind">Behind the Book</a>
    <a href="index.html#about">About the Authors</a>
    <a href="shop.html"><strong>Store</strong></a>
  </nav>

  <header class="hero">
    <div>
      <h1>Store</h1>
      <p>Official <em>Tres Amigos, Una Vida</em> shop — books, stickers, gifts, and more.</p>
      <p class="note">Secure checkout handled by Shopify.</p>
    </div>
  </header>

  <main>
    <div class="store-card">
      <!-- Your Shopify Buy Button (Collection) embed -->
      <div id='collection-component-1756234570120'></div>
      <script type="text/javascript">
      /*<![CDATA[*/
      (function () {
        var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';
        if (window.ShopifyBuy) {
          if (window.ShopifyBuy.UI) {
            ShopifyBuyInit();
          } else {
            loadScript();
          }
        } else {
          loadScript();
        }
        function loadScript() {
          var script = document.createElement('script');
          script.async = true;
          script.src = scriptURL;
          (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(script);
          script.onload = ShopifyBuyInit;
        }
        function ShopifyBuyInit() {
          var client = ShopifyBuy.buildClient({
            domain: 'outatinc.myshopify.com',
            storefrontAccessToken: '5ab76d1c31a639dbc32ea62cd825538d',
          });
          ShopifyBuy.UI.onReady(client).then(function (ui) {
            ui.createComponent('collection', {
              id: '517829853403',
              node: document.getElementById('collection-component-1756234570120'),
              moneyFormat: '%24%7B%7Bamount%7D%7D',
              options: {
                "product": {
                  "styles": {
                    "product": {
                      "@media (min-width: 601px)": {
                        "max-width": "calc(25% - 20px)",
                        "margin-left": "20px",
                        "margin-bottom": "50px",
                        "width": "calc(25% - 20px)"
                      },
                      "img": {
                        "height": "calc(100% - 15px)",
                        "position": "absolute",
                        "left": "0",
                        "right": "0",
                        "top": "0"
                      },
                      "imgWrapper": {
                        "padding-top": "calc(75% + 15px)",
                        "position": "relative",
                        "height": "0"
                      }
                    }
                  },
                  "text": { "button": "Add to cart" }
                },
                "productSet": {
                  "styles": {
                    "products": {
                      "@media (min-width: 601px)": { "margin-left": "-20px" }
                    }
                  }
                },
                "modalProduct": {
                  "contents": {
                    "img": false,
                    "imgWithCarousel": true,
                    "button": false,
                    "buttonWithQuantity": true
                  },
                  "styles": {
                    "product": {
                      "@media (min-width: 601px)": {
                        "max-width": "100%",
                        "margin-left": "0px",
                        "margin-bottom": "0px"
                      }
                    }
                  },
                  "text": { "button": "Add to cart" }
                },
                "option": {},
                "cart": {
                  "text": {
                    "total": "Subtotal",
                    "button": "Checkout"
                  }
                },
                "toggle": {}
              },
            });
          });
        }
      })();
      /*]]>*/
      </script>

      <noscript>
        Please enable JavaScript to view products.
      </noscript>
    </div>
  </main>

  <footer>
    &copy; 2025 <a href="https://3dudes1lifecreative.com/" target="_blank" style="color: #222; text-decoration: none; font-weight: bold;">3Dudes1Life Creative</a>. All rights reserved.
  </footer>
</body>
</html>
